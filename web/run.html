<!DOCTYPE html>
<html lang="zh-CN" class="is-run-window">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>运行</title>
  <link rel="stylesheet" href="/styles.css?v=202609126" />
</head>
<body class="is-run-window">
  <div id="loginGate" class="login-gate" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 7.2h14v2.4H5zm0 3.6h14v2.4H5zm0 3.6h9.2v2.4H5z" fill="currentColor"/></svg>
        </span>
        <span class="brand-name">集成开发平台</span>
      </div>
      <label class="label" for="authUser">账号</label>
      <div class="field-wrap">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 19.2c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="authUser" class="input has-icon" name="username" autocomplete="username" required />
      </div>
      <label class="label" for="authPass">密码</label>
      <div class="field-wrap">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 10V8a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="authPass" class="input has-icon has-eye" name="password" type="password" autocomplete="current-password" required />
        <button type="button" class="eye-btn" data-eye="authPass" aria-label="显示密码">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 12S6.2 6.8 12 6.8 21.2 12 21.2 12 17.8 17.2 12 17.2 2.8 12 2.8 12z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
      </div>
      <p class="hint error" id="loginError" hidden></p>
      <button type="submit" class="btn primary" id="btnAuthLogin">登录</button>
    </form>
  </div>

  <div id="appShell" class="app is-run-window">
    <div class="workspace">
      <section class="page page-run" id="pageRun">
        <div class="run-block">
          <label class="label" for="previewBranch">选择分支</label>
          <div class="run-branch-row">
            <div class="branch-picker" id="previewBranchPicker">
              <button type="button" class="input branch-trigger" id="previewBranch" aria-haspopup="listbox" aria-expanded="false">
                <span id="previewBranchValue"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="branch-menu" id="previewBranchMenu" role="listbox" hidden></div>
            </div>
            <button type="button" class="icon-btn" id="btnRefreshPreviewBranches" title="刷新" aria-label="刷新">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 12A7.4 7.4 0 0 1 16.8 6.3M19.4 12A7.4 7.4 0 0 1 7.2 17.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16.2 3.8v4.4h-4.4M7.8 20.2v-4.4h4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="branch-status" id="previewBranchStatus" hidden></p>
        </div>
        <div class="run-block run-block-tasks">
          <label class="label">选择任务</label>
          <section class="job-pipeline" id="runJobPipeline" aria-label="选择任务"></section>
          <p class="hint error" id="previewRunHint" hidden></p>
        </div>
        <div class="run-page-footer">
          <button type="button" class="btn primary" id="btnRunPreviewConfirm">确认</button>
          <button type="button" class="btn ghost" id="btnRunPreviewCancel">取消</button>
        </div>
      </section>
    </div>
  </div>

  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal" id="modalBox" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalTitle">对话框</h3>
        <button type="button" class="btn ghost" data-close-modal>关闭</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="/app.js?v=202609126"></script>
</body>
</html>
